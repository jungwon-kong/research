<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Research Observatory</title><style>body{font:16px system-ui,sans-serif;background:#f5f6f8;color:#182333;max-width:1000px;margin:auto;padding:24px}header{margin:30px 0}small{color:#657080}button,input,select,textarea{font:inherit;padding:10px;border:1px solid #ccd3dc;border-radius:8px;background:white}nav{display:flex;gap:8px;flex-wrap:wrap}article{background:white;padding:20px;margin:12px 0;border-radius:12px;border:1px solid #e0e4ea}a{color:#245b96}textarea{width:95%}button{cursor:pointer}h2{font-size:20px}#stats{margin:20px 0}</style><header><small>PERSONAL RESEARCH INTELLIGENCE</small><h1>Research Observatory</h1><p>음악 · 창의성 · 문화예술 정책</p></header><nav><input id="q" placeholder="제목, 저자, 키워드 검색"><select id="cat"><option value="">전체 분야</option><option>음악 연구</option><option>창의성 연구</option><option>국내 문화예술 정책</option><option>해외 문화예술 정책</option></select><select id="mode"><option value="">전체 자료</option><option value="saved">북마크</option><option value="unread">읽지 않음</option></select><input type="date" id="day"><button id="export">CSV 내보내기</button></nav><p id="stats">불러오는 중</p><main id="feed"></main><script>
const $=id=>document.getElementById(id);let rows=[],prefs=JSON.parse(localStorage.getItem('research-prefs')||'{}');const save=()=>localStorage.setItem('research-prefs',JSON.stringify(prefs));function filtered(){return rows.filter(r=>(!$('cat').value||r.category===$('cat').value)&&(!$('day').value||r.collected===$('day').value)&&JSON.stringify(r).toLowerCase().includes($('q').value.toLowerCase())&&(!$('mode').value||($('mode').value==='saved'?prefs[r.id]?.saved:!prefs[r.id]?.read)))}function render(){let items=filtered();$('stats').textContent=`전체 ${rows.length}건 · 검색 결과 ${items.length}건`; $('feed').replaceChildren();for(const r of items){let a=document.createElement('article'),p=prefs[r.id]??={};const add=(tag,t)=>{let e=document.createElement(tag);e.textContent=t;a.append(e);return e};add('small',`${r.category} · ${r.date||''} · ${r.source||''} · ${r.quartile||''}`);add('h2',r.title);add('p',r.authors||'');add('p',r.abstract||'초록 미제공');let link=add('a','원문 보기');if(/^https?:\/\//i.test(r.url))link.href=r.url;link.target='_blank';link.rel='noopener noreferrer';a.append(document.createElement('hr'));for(const [key,label] of [['saved','북마크'],['read','읽음']]){let b=add('button',`${p[key]?'✓ ':''}${label}`);b.onclick=()=>{p[key]=!p[key];save();render()}}let note=add('textarea','');note.placeholder='개인 메모 (현재 브라우저에만 저장)';note.value=p.note||'';note.oninput=()=>{p.note=note.value;save()};$('feed').append(a)}if(!items.length)$('feed').textContent='자료가 없습니다. 자동 수집을 실행하거나 필터를 변경하세요.'}for(const id of ['q','cat','mode','day'])$(id).oninput=render;$('export').onclick=()=>{let keys=['category','title','authors','date','source','url','quartile','abstract'];let csv=[keys.join(','),...filtered().map(r=>keys.map(k=>'"'+String(r[k]||'').replaceAll('"','""')+'"').join(','))].join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff',csv],{type:'text/csv'}));a.download='research.csv';a.click()};fetch('data/items.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(r=>{rows=r;render()}).catch(()=>$('stats').textContent='데이터를 불러오지 못했습니다.');</script></html>
