name: Collect research

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

concurrency:
  group: research-collection

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect new research
        run: python collect.py

      - name: Retrieve missing abstracts and articles
        run: python enrich.py

      - name: Generate Korean summaries
        run: python summarize.py

      - name: Save research database
        if: always()
        run: |
          git config user.name 'research-bot'
          git config user.email 'research-bot@users.noreply.github.com'
          git add data/
          git diff --cached --quiet || (git commit -m 'Update research database v2.1' && git push)
