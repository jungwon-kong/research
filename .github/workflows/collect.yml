name: Collect research
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
permissions:
  contents: write
concurrency:
  group: research-collection
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python collect.py
      - run: |
          git config user.name 'research-bot'
          git config user.email 'research-bot@users.noreply.github.com'
          git add data/items.json
          git diff --cached --quiet || (git commit -m 'Update research database' && git push)
